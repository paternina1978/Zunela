# Si Root Directory = zunela-web, apunta Config as Code a /railway.toml en la raíz
# o usa el Dockerfile de la raíz del repo con Root Directory vacío.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
