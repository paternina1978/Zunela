# En Railway: Settings → Root Directory = zunela-web
# Settings → Config as Code → /zunela-web/railway.toml (si no lo detecta solo)
[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
